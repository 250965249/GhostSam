name: Auto Build GhostSam

# Every run publishes a NEW release (tag `auto-YYYYMMDD-HHMM`) containing:
#   * the signed GhostSam APK + its checksums
#   * the SukiSU-Nova root manager APK, signed with the certificate
#     KernelSuProbe.kt expects (a manager signed any other way is not recognised)
#   * payloads.lock.json, so the next run can describe what changed
# `latest-auto` stays as a pointer release whose notes link to the newest build.
#
# Requires repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  # GitHub's scheduler for this account is unreliable: the producers' 18:00 UTC
  # slot actually fires around 22:30 UTC, and GhostRun's 21:00 UTC slot was
  # skipped outright on 2026-11-06 with no run entry at all. Fire three times a
  # day; the `gate` job skips the extra attempts once that day's release exists,
  # and manual runs always build.
  schedule:
    - cron: "0 21 * * *"   # 05:00 Asia/Shanghai
    - cron: "0 1 * * *"    # 09:00 Asia/Shanghai (catch-up)
    - cron: "0 5 * * *"    # 13:00 Asia/Shanghai (catch-up)
  # workflow_dispatch keeps getting rejected with HTTP 422 ("Actions has been
  # disabled for this repository") on this account even though the workflow is
  # active, so a push that touches .github/ci-trigger is the reliable "run now"
  # button. Nothing else in the tree triggers a build.
  push:
    branches: [Ci]
    paths:
      - '.github/ci-trigger'
  workflow_dispatch:
    inputs:
      allow_stale_payloads:
        description: "Publish even when a producer repo is behind its upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ghostsam-auto-build
  cancel-in-progress: false

env:
  PAYLOAD_DIR: app/app/src/main/assets/payloads/ksud
  SIDECAR_DIR: payloads-sidecars
  LOCK_FILE: payloads.lock.json
  # Stop-gap release switch: false keeps the maplesu identity/lock entry but marks it DISABLED
  # and drops the known-broken ksud-maplesu BINARY from the shipped APK. Flip to 'true' to restore.
  MAPLESU_PAYLOAD_ENABLED: 'false'
  COMPILE_SDK: "36"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether this trigger should build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "::notice::${{ github.event_name }} trigger - building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y%m%d)
          existing=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 \
            --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"auto-$today\"))] | .[0] // empty")
          if [ -n "${existing:-}" ]; then
            echo "::notice::already published $existing today - skipping this scheduled attempt"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing published for $today yet - building"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Ci
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream GhostSam main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/snothin/GhostSam.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            git push origin HEAD:Ci
          else
            git merge --abort
            echo "::warning::GhostSam upstream merge has conflicts; building the current Ci branch instead."
          fi

      - name: Freeze the source commit for all build jobs
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.manifest.outputs.stale }}
      invalid: ${{ steps.manifest.outputs.invalid }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Fetch latest ksud payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="${PAYLOAD_DIR}"
          side="${SIDECAR_DIR}"
          mkdir -p "$base" "$side"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # github.com/<repo>/releases/download/... intermittently answers 504 for
          # minutes at a time (seen right after a producer re-uploaded an asset),
          # while the API asset endpoint keeps serving the same file. Go through
          # the API and keep curl only as a fallback.
          fetch_gh() { # $1=repo $2=tag-or-empty $3=asset $4=dest
            local dir="$work/f$RANDOM"
            mkdir -p "$dir"
            if [ -n "$2" ]; then
              gh release download "$2" -R "$1" --pattern "$3" --dir "$dir" --clobber
            else
              gh release download -R "$1" --pattern "$3" --dir "$dir" --clobber
            fi
            test -f "$dir/$3"
            mv "$dir/$3" "$4"
            echo "$3 -> $4 ($(stat -c%s "$4") bytes)"
          }

          # default now comes from the Samsung-adapted KernelSU producer (a fork of
          # tiann/KernelSU rebased onto official main), not the official release.
          fetch_gh 250965249/KernelSU latest-ksud \
                   ksud-default-aarch64 "$base/ksud"
          fetch_gh 250965249/KernelSU-Next latest-ksud \
                   ksud-next-aarch64 "$base/ksud-next"
          # ksud embeds the kernel modules. Samsung requires the adapted modules
          # from the samsung producer; an official Nova binary is not a substitute
          # even when its version label is newer.
          fetch_gh 250965249/SukiSU-Ultra latest-ksud \
                   ksud-sukisu-aarch64 "$base/ksud-sukisu"
          # MapleSU standard variant (4th producer): fixed 32650 stamp, source-declared pin (fork 250965249/MapleSU is the only writable producer; t40-F4).
          fetch_gh 250965249/MapleSU latest-ksud \
                   ksud-maplesu-aarch64 "$base/ksud-maplesu"

          sidecar() { # $1=variant $2=repo
            local asset="ksud-$1-aarch64.version"
            local dir="$work/s$RANDOM"
            mkdir -p "$dir"
            if gh release download latest-ksud -R "$2" --pattern "$asset" --dir "$dir" --clobber 2>/dev/null; then
              mv "$dir/$asset" "$side/ksud-$1.version"
              echo "sidecar: $1 ok"
            else
              rm -f "$side/ksud-$1.version"
              echo "::warning::no version sidecar for $1 ($2) - the label falls back to the code stamped in the binary"
            fi
          }
          sidecar default 250965249/KernelSU
          sidecar next   250965249/KernelSU-Next
          sidecar sukisu 250965249/SukiSU-Ultra
          sidecar maplesu 250965249/MapleSU

          # A plain `file`-style check is not available on every runner image, so
          # verify the ELF magic and a sane size by hand.
          for f in ksud ksud-next ksud-sukisu ksud-maplesu; do
            test -s "$base/$f"
            head -c4 "$base/$f" | od -An -tx1 | grep -q '7f 45 4c 46'
            size=$(stat -c%s "$base/$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$f is only ${size} bytes - the download was truncated"
              exit 1
            fi
            echo "$f: ${size} bytes"
          done
          sha256sum "$base/ksud" "$base/ksud-next" "$base/ksud-sukisu" "$base/ksud-maplesu"

      - name: Verify Samsung payload provenance
        run: |
          python3 tools/verify_samsung_payloads.py \
            --payloads "$PAYLOAD_DIR" --sidecars "$SIDECAR_DIR"

      - name: Regenerate payload version manifest
        id: manifest
        run: |
          set -euo pipefail

          if ! python3 tools/gen_payload_versions.py \
                 --payloads "$PAYLOAD_DIR" \
                 --sidecars "$SIDECAR_DIR" \
                 --check --allow-problems >/dev/null 2>&1; then
            echo "::warning::the committed versions.properties did not match the bundled payloads; regenerating from the binaries"
          fi

          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --max-age-hours 48 \
            --lock-out "$LOCK_FILE" \
            --write --allow-problems

          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --lock-out "$LOCK_FILE" \
            --check --allow-problems >/dev/null

          echo "--- $PAYLOAD_DIR/versions.properties ---"
          cat "$PAYLOAD_DIR/versions.properties"
          cat "$LOCK_FILE"

          python3 tools/report_payloads.py \
            --lock "$LOCK_FILE" \
            --table /tmp/payload-table.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Reject invalid payload identity unconditionally
        if: ${{ steps.manifest.outputs.invalid == 'true' }}
        run: |
          echo "::error::payload SHA, version or required metadata is invalid; the stale override cannot bypass this"
          exit 1

      - name: Reject stale payloads before building or publishing
        if: ${{ steps.manifest.outputs.stale == 'true' && inputs.allow_stale_payloads != true }}
        run: |
          echo "::error::payload metadata is stale or unverified; no release will be published"
          exit 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK / NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-${COMPILE_SDK}" \
                                "build-tools;${COMPILE_SDK}.0.0" \
                                "ndk;30.0.16248370"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > app/ghostsam-ci.jks
          cat > app/keystore.properties <<EOF
          storeFile=ghostsam-ci.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Point the Gradle wrapper at a reachable mirror
        run: |
          set -euo pipefail
          props=app/gradle/wrapper/gradle-wrapper.properties
          test -f "$props"
          line=$(sed -n 's/^distributionUrl=//p' "$props")
          dist=${line##*/}
          dist=${dist//\\/}
          echo "distribution: $dist"
          chosen=""
          for base in \
            https://mirrors.cloud.tencent.com/gradle \
            https://mirrors.huaweicloud.com/gradle \
            https://services.gradle.org/distributions; do
            url="$base/$dist"
            if curl -fsS --max-time 25 -r 0-1023 -o /dev/null "$url"; then
              chosen="$url"
              break
            fi
            echo "::warning::unreachable Gradle distribution host: $url"
          done
          if [ -z "$chosen" ]; then
            echo "::error::no reachable Gradle distribution host - cannot build"
            exit 1
          fi
          # gradle-wrapper.properties escapes the colon of the URL
          escaped=$(printf '%s' "$chosen" | sed 's/:/\\:/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$escaped|" "$props"
          grep distributionUrl "$props"

      - name: Build release APK
        run: |
          set -e
          cd app
          sed -i "s/compileSdk = 37/compileSdk = ${COMPILE_SDK}/" app/build.gradle.kts
          sed -i "s/ndkVersion = \"30.0.15729638\"/ndkVersion = \"30.0.16248370\"/" app/build.gradle.kts
          chmod +x gradlew
          # Stop-gap release: drop the known-broken ksud-maplesu BINARY from the packaged
          # assets (identity/lock entry is kept, marked DISABLED, so the manager pairing and
          # GhostSam-manager-MapleSU.apk still work). One env switch restores it.
          if [ "${MAPLESU_PAYLOAD_ENABLED:-false}" != "true" ]; then
            rm -f "$GITHUB_WORKSPACE/$PAYLOAD_DIR/ksud-maplesu"
            echo "::notice::dropped ksud-maplesu from the app assets (stop-gap; versions.properties marks it DISABLED)"
          fi
          # services.gradle.org has been answering 504 and the wrapper only tries
          # once, so retry the whole invocation - the distribution download
          # resumes on the next attempt.
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease --no-daemon --stacktrace \
                 -Pandroid.experimental.disableCompileSdkChecks=true \
                 -PmaplesuPayloadEnabled=${MAPLESU_PAYLOAD_ENABLED:-false}; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::gradle failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::gradle attempt $attempt failed - retrying in 20s"
            sleep 20
          done
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify the APK carries the regenerated manifest
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/release/app-release.apk"
          unzip -p "$apk" assets/payloads/ksud/versions.properties > /tmp/apk-versions.properties
          diff -u "$PAYLOAD_DIR/versions.properties" /tmp/apk-versions.properties
          echo "::notice::shipped manifest matches the bundled payloads"
          cat /tmp/apk-versions.properties

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/app/build/outputs/apk/release/app-release.apk \
             "dist/GhostSam_auto_$(date -u +%Y%m%d-%H%M).apk"
          cp "$LOCK_FILE" dist/payloads.lock.json
          cp "$PAYLOAD_DIR/versions.properties" dist/versions.properties
          ( cd dist && sha256sum *.apk > checksums.txt )
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ghostsam-app
          path: dist/*
          if-no-files-found: error

  # The producer-signed root manager rides along with every GhostSam build.
  # KernelSuProbe.kt pins the producer certificate, so a manager signed with a
  # different key is rejected before an exploit starts. SukiSU is pinned to the
  # Nova v3.0.0 release by tools/fetch_managers.py.
  managers:
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          name: ghostsam-app
          path: app-output

      - name: Download the managers for the same APK build snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The official KernelSU-Next and KernelSU managers now ship with their
          # Samsung-adapted producers (each shares the required UAPI and official
          # source base of its managed kernel), so all three managers release
          # together.
          python3 tools/fetch_managers.py \
            --payload-lock app-output/payloads.lock.json \
            --only sukisu --only next --only default --only maplesu \
            --out managers
          ls -l managers
          cat managers/managers.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Verify signatures and the APK manager pairing before release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/verify_manager_apks.py --only sukisu --only next --only default --only maplesu --managers managers \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk=$(find app-output -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          python3 tools/verify_manager_pairing.py --only sukisu --only next --only default --only maplesu \
            --lock app-output/payloads.lock.json --apk "$apk" \
            --managers managers --out managers/manager-pairing.json

      - uses: actions/upload-artifact@v7
        with:
          name: managers
          path: managers/*
          if-no-files-found: error

  publish:
    needs: [sync, build, managers]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.managers.result == 'success' && needs.build.outputs.invalid != 'true' && (needs.build.outputs.stale != 'true' || inputs.allow_stale_payloads == true) }}
    runs-on: ubuntu-latest
    env:
      BUILD_COMMIT: ${{ needs.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1

      - name: Download the app artifacts
        uses: actions/download-artifact@v7
        with:
          name: ghostsam-app
          path: dist

      - name: Download the verified managers
        uses: actions/download-artifact@v7
        with:
          name: managers
          path: managers

      - name: Check all release inputs before any publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s dist/payloads.lock.json
          test -s dist/versions.properties
          test -s managers/GhostSam-manager-SukiSU.apk
          test -s managers/GhostSam-manager-KernelSU-Next.apk
          test -s managers/GhostSam-manager-KernelSU.apk
          test -s managers/GhostSam-manager-MapleSU.apk
          test -s managers/managers.json
          test -s managers/manager-pairing.json
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          python3 tools/verify_manager_pairing.py --only sukisu --only next --only default --only maplesu \
            --lock dist/payloads.lock.json --apk "$apk" \
            --managers managers --out managers/manager-pairing.json
          ( cd managers && sha256sum *.apk > ../managers.sha256 )

      - name: List what we have
        run: |
          set -u
          ls -lR dist managers 2>/dev/null || true

      - name: Fetch the previous release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p prev
          prev_tag=$(gh release list --exclude-drafts --limit 60 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("auto-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // empty')
          echo "previous release: ${prev_tag:-none}"
          if [ -n "${prev_tag:-}" ]; then
            gh release download "$prev_tag" --pattern payloads.lock.json --dir prev --clobber || true
          fi
          ls -l prev || true

      - name: Compose release notes
        run: |
          set -euo pipefail
          tag=$(date -u +auto-%Y%m%d-%H%M)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          # name the APK after the release tag so the asset and the tag agree
          renamed="dist/GhostSam_${tag#auto-}.apk"
          if [ "$apk" != "$renamed" ]; then
            mv "$apk" "$renamed"
            apk="$renamed"
          fi
          ( cd dist && sha256sum *.apk > checksums.txt )
          python3 tools/render_release_notes.py \
            --lock dist/payloads.lock.json \
            --previous prev/payloads.lock.json \
            --apk "$apk" \
            --managers managers \
            --tag "$tag" \
            --out /tmp/release-notes.md
          cat /tmp/release-notes.md
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the complete release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.apk dist/checksums.txt dist/payloads.lock.json dist/versions.properties
                 managers/*.apk managers/managers.json managers/manager-pairing.json managers.sha256)
          for f in "${files[@]}"; do test -s "$f"; done
          gh release create "$TAG" --draft --target "$BUILD_COMMIT" \
            --title "GhostSam ${TAG#auto-}" \
            --notes-file /tmp/release-notes.md "${files[@]}"
          echo "::notice::complete draft staged for $BUILD_COMMIT"

      - name: Publish only after every asset was uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "::notice::published verified complete release $TAG"

      - name: Move the latest-auto pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          notes="最新自动构建：[\`$TAG\`](../../releases/tag/$TAG)"
          if gh release view latest-auto >/dev/null 2>&1; then
            # keep the old URL alive without storing a second copy of the APK
            for a in $(gh release view latest-auto --json assets --jq '.assets[].name'); do
              gh release delete-asset latest-auto "$a" --yes >/dev/null 2>&1 || true
            done
            gh release edit latest-auto --notes "$notes"
          else
            gh release create latest-auto --title "GhostSam latest auto build" --notes "$notes"
          fi
