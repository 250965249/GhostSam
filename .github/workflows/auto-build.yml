name: Auto Build GhostSam

# Every run publishes a NEW release (tag `auto-YYYYMMDD-HHMM`) containing:
#   * the signed GhostSam APK + its checksums
#   * the SukiSU-Ultra and BakaSU root manager APKs, signed with the same
#     certificate GhostSam itself uses (that is the cert KernelSuProbe.kt
#     expects, so an installed manager signed any other way is not recognised)
#   * payloads.lock.json, so the next run can describe what changed
# `latest-auto` stays as a pointer release whose notes link to the newest build.
#
# Requires repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  # GitHub's scheduler for this account is unreliable: the producers' 18:00 UTC
  # slot actually fires around 22:30 UTC, and GhostRun's 21:00 UTC slot was
  # skipped outright on 2026-11-06 with no run entry at all. Fire three times a
  # day; the `gate` job skips the extra attempts once that day's release exists,
  # and manual runs always build.
  schedule:
    - cron: "0 21 * * *"   # 05:00 Asia/Shanghai
    - cron: "0 1 * * *"    # 09:00 Asia/Shanghai (catch-up)
    - cron: "0 5 * * *"    # 13:00 Asia/Shanghai (catch-up)
  # workflow_dispatch keeps getting rejected with HTTP 422 ("Actions has been
  # disabled for this repository") on this account even though the workflow is
  # active, so a push that touches .github/ci-trigger is the reliable "run now"
  # button. Nothing else in the tree triggers a build.
  push:
    branches: [bakasu]
    paths:
      - '.github/ci-trigger'
  workflow_dispatch:
    inputs:
      allow_stale_payloads:
        description: "Publish even when a producer repo is behind its upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ghostsam-auto-build
  cancel-in-progress: false

env:
  PAYLOAD_DIR: app/app/src/main/assets/payloads/ksud
  SIDECAR_DIR: payloads-sidecars
  LOCK_FILE: payloads.lock.json
  COMPILE_SDK: "36"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether this trigger should build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "::notice::${{ github.event_name }} trigger - building"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y%m%d)
          existing=$(gh release list -R "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"auto-$today\"))] | .[0] // empty")
          if [ -n "${existing:-}" ]; then
            echo "::notice::already published $existing today - skipping this scheduled attempt"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing published for $today yet - building"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream GhostSam main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/snothin/GhostSam.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            git push origin HEAD:bakasu
          else
            git merge --abort
            echo "::warning::GhostSam upstream merge has conflicts; building the current bakasu branch instead."
          fi

  build:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.manifest.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
          fetch-depth: 0

      - name: Fetch latest ksud payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="${PAYLOAD_DIR}"
          side="${SIDECAR_DIR}"
          mkdir -p "$base" "$side"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # github.com/<repo>/releases/download/... intermittently answers 504 for
          # minutes at a time (seen right after a producer re-uploaded an asset),
          # while the API asset endpoint keeps serving the same file. Go through
          # the API and keep curl only as a fallback.
          fetch_gh() { # $1=repo $2=tag-or-empty $3=asset $4=dest
            local dir="$work/f$RANDOM"
            mkdir -p "$dir"
            if [ -n "$2" ]; then
              gh release download "$2" -R "$1" --pattern "$3" --dir "$dir" --clobber
            else
              gh release download -R "$1" --pattern "$3" --dir "$dir" --clobber
            fi
            test -f "$dir/$3"
            mv "$dir/$3" "$4"
            echo "$3 -> $4 ($(stat -c%s "$4") bytes)"
          }

          fetch_gh tiann/KernelSU "" \
                   ksud-aarch64-linux-android "$base/ksud"
          fetch_gh 250965249/KernelSU-Next-Samsung latest-ksud \
                   ksud-next-aarch64 "$base/ksud-next"
          fetch_gh 250965249/SukiSU-Ultra latest-ksud \
                   ksud-sukisu-aarch64 "$base/ksud-sukisu"
          fetch_gh 250965249/BakaSU latest-ksud \
                   ksud-bakasu-aarch64 "$base/ksud-bakasu"

          sidecar() { # $1=variant $2=repo
            local asset="ksud-$1-aarch64.version"
            local dir="$work/s$RANDOM"
            mkdir -p "$dir"
            if gh release download latest-ksud -R "$2" --pattern "$asset" --dir "$dir" --clobber 2>/dev/null; then
              mv "$dir/$asset" "$side/ksud-$1.version"
              echo "sidecar: $1 ok"
            else
              rm -f "$side/ksud-$1.version"
              echo "::warning::no version sidecar for $1 ($2) - the label falls back to the code stamped in the binary"
            fi
          }
          sidecar next   250965249/KernelSU-Next-Samsung
          sidecar sukisu 250965249/SukiSU-Ultra
          sidecar bakasu 250965249/BakaSU

          # A plain `file`-style check is not available on every runner image, so
          # verify the ELF magic and a sane size by hand.
          for f in ksud ksud-next ksud-sukisu ksud-bakasu; do
            test -s "$base/$f"
            head -c4 "$base/$f" | od -An -tx1 | grep -q '7f 45 4c 46'
            size=$(stat -c%s "$base/$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$f is only ${size} bytes - the download was truncated"
              exit 1
            fi
            echo "$f: ${size} bytes"
          done
          sha256sum "$base/ksud" "$base/ksud-next" "$base/ksud-sukisu" "$base/ksud-bakasu"

      - name: Regenerate payload version manifest
        id: manifest
        run: |
          set -euo pipefail

          if ! python3 tools/gen_payload_versions.py \
                 --payloads "$PAYLOAD_DIR" \
                 --sidecars "$SIDECAR_DIR" \
                 --check --allow-problems >/dev/null 2>&1; then
            echo "::warning::the committed versions.properties did not match the bundled payloads; regenerating from the binaries"
          fi

          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --max-age-hours 48 \
            --lock-out "$LOCK_FILE" \
            --write --allow-problems

          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --lock-out "$LOCK_FILE" \
            --check --allow-problems >/dev/null

          echo "--- $PAYLOAD_DIR/versions.properties ---"
          cat "$PAYLOAD_DIR/versions.properties"
          cat "$LOCK_FILE"

          python3 tools/report_payloads.py \
            --lock "$LOCK_FILE" \
            --table /tmp/payload-table.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK / NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-${COMPILE_SDK}" \
                                "build-tools;${COMPILE_SDK}.0.0" \
                                "ndk;30.0.16248370"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > app/ghostsam-ci.jks
          cat > app/keystore.properties <<EOF
          storeFile=ghostsam-ci.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Point the Gradle wrapper at a reachable mirror
        run: |
          set -euo pipefail
          props=app/gradle/wrapper/gradle-wrapper.properties
          test -f "$props"
          line=$(sed -n 's/^distributionUrl=//p' "$props")
          dist=${line##*/}
          dist=${dist//\\/}
          echo "distribution: $dist"
          chosen=""
          for base in \
            https://mirrors.cloud.tencent.com/gradle \
            https://mirrors.huaweicloud.com/gradle \
            https://services.gradle.org/distributions; do
            url="$base/$dist"
            if curl -fsS --max-time 25 -r 0-1023 -o /dev/null "$url"; then
              chosen="$url"
              break
            fi
            echo "::warning::unreachable Gradle distribution host: $url"
          done
          if [ -z "$chosen" ]; then
            echo "::error::no reachable Gradle distribution host - cannot build"
            exit 1
          fi
          # gradle-wrapper.properties escapes the colon of the URL
          escaped=$(printf '%s' "$chosen" | sed 's/:/\\:/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$escaped|" "$props"
          grep distributionUrl "$props"

      - name: Build release APK
        run: |
          set -e
          cd app
          sed -i "s/compileSdk = 37/compileSdk = ${COMPILE_SDK}/" app/build.gradle.kts
          sed -i "s/ndkVersion = \"30.0.15729638\"/ndkVersion = \"30.0.16248370\"/" app/build.gradle.kts
          chmod +x gradlew
          # services.gradle.org has been answering 504 and the wrapper only tries
          # once, so retry the whole invocation - the distribution download
          # resumes on the next attempt.
          for attempt in 1 2 3 4; do
            if ./gradlew assembleRelease --no-daemon --stacktrace \
                 -Pandroid.experimental.disableCompileSdkChecks=true; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::gradle failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::gradle attempt $attempt failed - retrying in 20s"
            sleep 20
          done
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify the APK carries the regenerated manifest
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/release/app-release.apk"
          unzip -p "$apk" assets/payloads/ksud/versions.properties > /tmp/apk-versions.properties
          diff -u "$PAYLOAD_DIR/versions.properties" /tmp/apk-versions.properties
          echo "::notice::shipped manifest matches the bundled payloads"
          cat /tmp/apk-versions.properties

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/app/build/outputs/apk/release/app-release.apk \
             "dist/GhostSam_auto_$(date -u +%Y%m%d-%H%M).apk"
          cp "$LOCK_FILE" dist/payloads.lock.json
          cp "$PAYLOAD_DIR/versions.properties" dist/versions.properties
          ( cd dist && sha256sum *.apk > checksums.txt )
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ghostsam-app
          path: dist/*
          if-no-files-found: error

  # The two root managers ride along with every GhostSam build. They are built
  # from the producer sources and signed with the GhostSam keystore on purpose:
  # KernelSuProbe.kt pins BAKASU_MANAGER_CERT_SHA256 to that certificate, so a
  # manager signed any other way is treated as "not installed".
  # The two root managers ride along with every GhostSam build. They are NOT
  # rebuilt here: each project already publishes a signed manager with every
  # release, so we pull the release whose tag matches the ksud we are shipping
  # (ksud 4.3.0-r2-17-g... -> SukiSU-Ultra v4.3.0-r2).
  managers:
    needs: sync
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
          fetch-depth: 1

      - name: Fetch the ksud version sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${SIDECAR_DIR}"
          sidecar() { # $1=variant $2=repo
            local asset="ksud-$1-aarch64.version"
            local dir
            dir=$(mktemp -d)
            if gh release download latest-ksud -R "$2" --pattern "$asset" --dir "$dir" --clobber 2>/dev/null; then
              mv "$dir/$asset" "${SIDECAR_DIR}/ksud-$1.version"
            else
              rm -f "${SIDECAR_DIR}/ksud-$1.version"
              echo "::warning::no sidecar for $1 - the manager is picked from the newest release instead"
            fi
            rm -rf "$dir"
          }
          sidecar sukisu 250965249/SukiSU-Ultra
          sidecar bakasu 250965249/BakaSU
          ls -l "${SIDECAR_DIR}"

      - name: Download the managers that match those ksud versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/fetch_managers.py \
            --sidecars "${SIDECAR_DIR}" \
            --out managers
          ls -l managers
          cat managers/managers.json

      - uses: actions/upload-artifact@v7
        with:
          name: managers
          path: managers/*
          if-no-files-found: error

  publish:
    needs: [build, managers]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
          fetch-depth: 1

      - name: Download the app artifacts
        uses: actions/download-artifact@v7
        with:
          name: ghostsam-app
          path: dist

      - name: Download the managers
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: managers
          path: managers

      - name: List what we have
        run: |
          set -u
          ls -lR dist managers 2>/dev/null || true

      - name: Fetch the previous release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p prev
          prev_tag=$(gh release list --exclude-drafts --limit 60 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("auto-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // empty')
          echo "previous release: ${prev_tag:-none}"
          if [ -n "${prev_tag:-}" ]; then
            gh release download "$prev_tag" --pattern payloads.lock.json --dir prev --clobber || true
          fi
          ls -l prev || true

      - name: Compose release notes
        run: |
          set -euo pipefail
          tag=$(date -u +auto-%Y%m%d-%H%M)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          # name the APK after the release tag so the asset and the tag agree
          renamed="dist/GhostSam_${tag#auto-}.apk"
          if [ "$apk" != "$renamed" ]; then
            mv "$apk" "$renamed"
            apk="$renamed"
          fi
          ( cd dist && sha256sum *.apk > checksums.txt )
          python3 tools/render_release_notes.py \
            --lock dist/payloads.lock.json \
            --previous prev/payloads.lock.json \
            --apk "$apk" \
            --managers managers \
            --tag "$tag" \
            --out /tmp/release-notes.md
          cat /tmp/release-notes.md
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=""
          for f in dist/*.apk dist/checksums.txt dist/payloads.lock.json dist/versions.properties; do
            [ -f "$f" ] && files="$files $f"
          done
          test -n "$files"
          gh release create "$TAG" \
            --title "GhostSam ${TAG#auto-}" \
            --notes-file /tmp/release-notes.md \
            $files
          echo "::notice::published $TAG"

      - name: Attach the root managers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if compgen -G "managers/*.apk" > /dev/null; then
            ( cd managers && sha256sum *.apk > ../managers.sha256 )
            gh release upload "$TAG" managers/*.apk managers.sha256
            echo "::notice::attached manager APKs"
          else
            echo "::warning::no manager APK was built this run - the release has none"
          fi

      - name: Move the latest-auto pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          notes="最新自动构建：[\`$TAG\`](../../releases/tag/$TAG)"
          if gh release view latest-auto >/dev/null 2>&1; then
            # keep the old URL alive without storing a second copy of the APK
            for a in $(gh release view latest-auto --json assets --jq '.assets[].name'); do
              gh release delete-asset latest-auto "$a" --yes >/dev/null 2>&1 || true
            done
            gh release edit latest-auto --notes "$notes"
          else
            gh release create latest-auto --title "GhostSam latest auto build" --notes "$notes"
          fi

      - name: Fail when a payload is behind its upstream
        if: ${{ needs.build.outputs.stale == 'true' && inputs.allow_stale_payloads != true }}
        run: |
          echo "::error::at least one ksud payload is out of sync with its upstream CI build - see the notes of $TAG"
          exit 1

      - name: Fail when a root manager is missing
        run: |
          set -u
          missing=""
          [ -f "managers/GhostSam-manager-SukiSU.apk" ] || missing="$missing SukiSU"
          [ -f "managers/GhostSam-manager-BakaSU.apk" ] || missing="$missing BakaSU"
          if [ -n "$missing" ]; then
            echo "::error::manager APK missing for:$missing - open the 'managers' job log; the release was still published without it"
            exit 1
          fi
