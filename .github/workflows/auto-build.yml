name: Auto Build GhostSam

# Daily: sync GhostSam upstream, fetch the latest four ksud payloads, regenerate
# the payload version manifest from those binaries, build and sign GhostSam.
#
# The manifest (app/app/src/main/assets/payloads/ksud/versions.properties) is the
# only thing the settings screen reads for "KernelSU 版本 → 当前 Payload：…", so it is
# regenerated from the payloads that actually ship in this APK. It is never
# carried over from a previous run, which is what used to freeze the label at
# 41098 while newer binaries were already being bundled.
#
# Requires repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  schedule:
    - cron: "0 21 * * *"   # 05:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      allow_stale_payloads:
        description: "Publish even when a producer repo is behind its upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ghostsam-auto-build
  cancel-in-progress: false

env:
  PAYLOAD_DIR: app/app/src/main/assets/payloads/ksud
  SIDECAR_DIR: payloads-sidecars

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream GhostSam main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/snothin/GhostSam.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            git push origin HEAD:bakasu
          else
            git merge --abort
            echo "::warning::GhostSam upstream merge has conflicts; building the current bakasu branch instead."
          fi

  build:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch tip, not the sha that triggered the run: the sync job above
          # may have pushed a new merge commit seconds ago.
          ref: bakasu
          fetch-depth: 0

      - name: Fetch latest ksud payloads
        run: |
          set -euo pipefail
          base="${PAYLOAD_DIR}"
          side="${SIDECAR_DIR}"
          mkdir -p "$base" "$side"

          fetch() { # $1=url $2=dest
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o "$2" "$1"
          }

          # --- binaries -------------------------------------------------------
          fetch https://github.com/tiann/KernelSU/releases/latest/download/ksud-aarch64-linux-android \
                "$base/ksud"
          fetch https://github.com/250965249/KernelSU-Next-Samsung/releases/download/latest-ksud/ksud-next-aarch64 \
                "$base/ksud-next"
          fetch https://github.com/250965249/SukiSU-Ultra/releases/download/latest-ksud/ksud-sukisu-aarch64 \
                "$base/ksud-sukisu"
          fetch https://github.com/250965249/BakaSU/releases/download/latest-ksud/ksud-bakasu-aarch64 \
                "$base/ksud-bakasu"

          # --- producer version sidecars --------------------------------------
          # Emitted by each fork's auto-sync-build workflow. They carry the real
          # version_name (the binary alone cannot express it once a fork release
          # tag has polluted `git describe`) plus the upstream distance.
          sidecar() { # $1=variant $2=repo
            local asset="ksud-$1-aarch64.version"
            if curl -fsSL --retry 2 --connect-timeout 20 \
                 -o "$side/ksud-$1.version" \
                 "https://github.com/$2/releases/download/latest-ksud/$asset"; then
              echo "sidecar: $1 ok"
            else
              rm -f "$side/ksud-$1.version"
              echo "::warning::no version sidecar for $1 ($2) — the label falls back to the code stamped in the binary. Upgrade that producer's auto-sync-build workflow."
            fi
          }
          sidecar next   250965249/KernelSU-Next-Samsung
          sidecar sukisu 250965249/SukiSU-Ultra
          sidecar bakasu 250965249/BakaSU

          # --- sanity: four little-endian ELF executables, none truncated ------
          for f in ksud ksud-next ksud-sukisu ksud-bakasu; do
            test -s "$base/$f"
            head -c4 "$base/$f" | od -An -tx1 | grep -q '7f 45 4c 46'
            size=$(stat -c%s "$base/$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$f is only ${size} bytes - the download was truncated"
              exit 1
            fi
            echo "$f: ${size} bytes"
          done
          sha256sum "$base/ksud" "$base/ksud-next" "$base/ksud-sukisu" "$base/ksud-bakasu"

      - name: Regenerate payload version manifest
        id: manifest
        run: |
          set -euo pipefail

          # What is committed today may already be stale - that is precisely the
          # bug this fixes - so report the drift and then overwrite it.
          if ! python3 tools/gen_payload_versions.py \
                 --payloads "$PAYLOAD_DIR" \
                 --sidecars "$SIDECAR_DIR" \
                 --check --allow-problems >/dev/null 2>&1; then
            echo "::warning::the committed versions.properties did not match the bundled payloads; regenerating from the binaries"
          fi

          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --max-age-hours 48 \
            --write --allow-problems

          # Determinism guard: a second pass must reproduce the same bytes.
          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" \
            --sidecars "$SIDECAR_DIR" \
            --check --allow-problems >/dev/null

          echo "--- $PAYLOAD_DIR/versions.properties ---"
          cat "$PAYLOAD_DIR/versions.properties"
          cat "$PAYLOAD_DIR/payloads.lock.json"

          python3 tools/report_payloads.py \
            --lock "$PAYLOAD_DIR/payloads.lock.json" \
            --table /tmp/payload-table.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android 36 / NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > app/ghostsam-ci.jks
          cat > app/keystore.properties <<EOF
          storeFile=ghostsam-ci.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          set -e
          cd app
          # The hosted runner has no Android 37 package yet. GhostSam targets API 36;
          # compile with SDK 36 and skip the dependency AAR compileSdk warning check.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/ndkVersion = "30.0.15729638"/ndkVersion = "30.0.16248370"/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.experimental.disableCompileSdkChecks=true
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify the APK carries the regenerated manifest
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/release/app-release.apk"
          unzip -p "$apk" assets/payloads/ksud/versions.properties > /tmp/apk-versions.properties
          diff -u "$PAYLOAD_DIR/versions.properties" /tmp/apk-versions.properties
          echo "::notice::shipped manifest matches the bundled payloads"
          cat /tmp/apk-versions.properties
          for f in ksud ksud-next ksud-sukisu ksud-bakasu; do
            unzip -l "$apk" "assets/payloads/ksud/$f" | tail -n1
          done

      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            echo "Automatically synced upstream GhostSam + latest KernelSU / KernelSU-Next / SukiSU / BakaSU ksud payloads."
            echo
            cat /tmp/payload-table.md
            echo
            echo "Manifest generated $(date -u +%Y-%m-%dT%H:%M:%SZ) from the binaries bundled in this APK."
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest-auto release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/release/app-release.apk"
          out="GhostSam_auto_$(date -u +%Y%m%d).apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          if ! gh release view latest-auto >/dev/null 2>&1; then
            gh release create latest-auto --title "GhostSam auto build" \
              --notes-file /tmp/release-notes.md
          else
            gh release edit latest-auto --notes-file /tmp/release-notes.md
          fi
          gh release upload latest-auto "$out" "$out.sha256" --clobber
          echo "::notice::published $out"

      # Publish first, then go red: a stale payload must never look like success,
      # but silently withholding the daily APK would hide the problem even better.
      - name: Fail when a payload is behind its upstream
        if: ${{ steps.manifest.outputs.stale == 'true' && inputs.allow_stale_payloads != true }}
        run: |
          echo "::error::At least one ksud payload is out of sync with its upstream CI build. See the payload table in the release notes: the producing repo's auto-sync-build workflow hit a merge conflict, lost its schedule, or built a stale checkout."
          exit 1
