name: P5a build (four payloads, maplesu included)

# Feeds the MapleSU ksud+LKM bundle into the GhostSam container and builds the APK
# with all four payloads bundled (default / next / sukisu from their producers,
# maplesu from a MapleSU fork run artifact), then proves the packaged result.
#
# Why the payload is fetched here rather than committed: the artifact is 46.6 MB and
# this machine reaches GitHub object storage at 3-40 KB/s, so pulling it locally to
# commit it is not practical. The build is deterministic - the artifact id and its
# digest are pinned in the receipt, and tools/emit_samsung_sidecar.py refuses to
# write a field it cannot measure.
#
# Cross-repository read needs a token: GITHUB_TOKEN only sees this repository, so add
# a repository secret MAPLESU_ARTIFACT_TOKEN (fine-grained PAT: Actions = read on
# 250965249/MapleSU). Without it the workflow stops with an explicit message instead
# of silently building a three-payload APK.

on:
  workflow_dispatch:
    inputs:
      maplesu_artifact_id:
        description: "MapleSU Actions artifact id holding the ksud payload (default: identity build 45575513087)"
        default: "15004182306"
      maplesu_payload_member:
        description: "ksud payload path inside the artifact zip"
        default: "libksud_ksu.so"
      maplesu_run_id:
        description: "producer run id recorded in the receipt"
        default: "45575513087"
      maplesu_commit:
        description: "MapleSU commit the artifact was built from"
        default: "e8676cac90d962751b588445c13f8eb60dde81cb"
      maplesu_artifact_digest:
        description: "artifact digest from the Actions API (sha256:...)"
        default: "sha256:b084000bb5fc1f932f7addbc00755c8a3176bfda22625cf9c8c091e03a1d38da"
      maplesu_kernel_uapi:
        description: "kernel UAPI the payload was built against (the t10 manifest records identity.uapiVersion = 7, not 6)"
        default: "7"

permissions:
  contents: write
  actions: read

env:
  PAYLOAD_DIR: app/app/src/main/assets/payloads/ksud
  SIDECAR_DIR: payloads-sidecars
  LOCK_FILE: payloads.lock.json
  COMPILE_SDK: "36"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: add-maplesu-variant
          fetch-depth: 1

      - name: Fetch the three live payloads and their receipts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="$PAYLOAD_DIR"; side="$SIDECAR_DIR"
          mkdir -p "$base" "$side"
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          fetch_gh() { # $1=repo $2=tag $3=asset $4=dest
            local dir="$work/f$RANDOM"; mkdir -p "$dir"
            gh release download "$2" -R "$1" --pattern "$3" --dir "$dir" --clobber
            test -f "$dir/$3"; mv "$dir/$3" "$4"
            echo "$3 -> $4 ($(stat -c%s "$4") bytes)"
          }
          sidecar() { # $1=variant $2=repo
            local asset="ksud-$1-aarch64.version"; local dir="$work/s$RANDOM"; mkdir -p "$dir"
            gh release download latest-ksud -R "$2" --pattern "$asset" --dir "$dir" --clobber
            mv "$dir/$asset" "$side/ksud-$1.version"
            echo "sidecar: $1 from $2"
          }
          fetch_gh 250965249/KernelSU     latest-ksud ksud-default-aarch64 "$base/ksud"
          fetch_gh 250965249/KernelSU-Next latest-ksud ksud-next-aarch64   "$base/ksud-next"
          fetch_gh 250965249/SukiSU-Ultra latest-ksud ksud-sukisu-aarch64  "$base/ksud-sukisu"
          sidecar default 250965249/KernelSU
          sidecar next    250965249/KernelSU-Next
          sidecar sukisu  250965249/SukiSU-Ultra

      - name: Feed the maplesu payload from the MapleSU run artifact
        env:
          MAPLESU_TOKEN: ${{ secrets.MAPLESU_ARTIFACT_TOKEN }}
          ARTIFACT_ID: ${{ inputs.maplesu_artifact_id }}
          MEMBER: ${{ inputs.maplesu_payload_member }}
          RUN_ID: ${{ inputs.maplesu_run_id }}
          MAPLE_COMMIT: ${{ inputs.maplesu_commit }}
          ARTIFACT_DIGEST: ${{ inputs.maplesu_artifact_digest }}
          KERNEL_UAPI: ${{ inputs.maplesu_kernel_uapi }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="${ARTIFACT_ID:-15004182306}"
          MEMBER="${MEMBER:-libksud_ksu.so}"
          RUN_ID="${RUN_ID:-45575513087}"
          MAPLE_COMMIT="${MAPLE_COMMIT:-e8676cac90d962751b588445c13f8eb60dde81cb}"
          ARTIFACT_DIGEST="${ARTIFACT_DIGEST:-sha256:b084000bb5fc1f932f7addbc00755c8a3176bfda22625cf9c8c091e03a1d38da}"
          KERNEL_UAPI="${KERNEL_UAPI:-7}"
          out="$PAYLOAD_DIR/ksud-maplesu"

          if [ -s "$out" ]; then
            echo "::notice::$out is already committed in the tree - using it as-is"
          else
            if [ -z "${MAPLESU_TOKEN:-}" ]; then
              echo "::error::no ${out} in the tree and no MAPLESU_ARTIFACT_TOKEN secret."
              echo "::error::Either add a fine-grained PAT (Actions: read on 250965249/MapleSU) as MAPLESU_ARTIFACT_TOKEN, or commit the payload to ${out} and re-run."
              exit 1
            fi
            work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
            echo "downloading artifact ${ARTIFACT_ID} (${ARTIFACT_DIGEST})"
            curl -fsSL --retry 5 --retry-all-errors --max-time 1800 \
              -H "Authorization: Bearer ${MAPLESU_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/250965249/MapleSU/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o "$work/artifact.zip"
            got=$(sha256sum "$work/artifact.zip" | cut -d' ' -f1)
            echo "artifact sha256 $got"
            test "sha256:$got" = "$ARTIFACT_DIGEST" || { echo "::error::artifact digest differs from the receipt: $got"; exit 1; }
            python3 tools/extract_artifact_member.py "$work/artifact.zip" "$MEMBER" "$work/payload.bin"
            install -m 0644 "$work/payload.bin" "$out"
          fi
          stat -c '%n %s bytes' "$out"
          sha256sum "$out"
          python3 tools/probe_payload_version.py "$out" --variant maplesu --json

      - name: Emit the maplesu receipt from measured facts
        env:
          ARTIFACT_ID: ${{ inputs.maplesu_artifact_id }}
          RUN_ID: ${{ inputs.maplesu_run_id }}
          MAPLE_COMMIT: ${{ inputs.maplesu_commit }}
          ARTIFACT_DIGEST: ${{ inputs.maplesu_artifact_digest }}
          KERNEL_UAPI: ${{ inputs.maplesu_kernel_uapi }}
        run: |
          set -euo pipefail
          mkdir -p tools/sidecars
          python3 tools/emit_samsung_sidecar.py \
            --payload "$PAYLOAD_DIR/ksud-maplesu" --variant maplesu \
            --commit "${MAPLE_COMMIT:-e8676cac90d962751b588445c13f8eb60dde81cb}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --kernel-uapi "${KERNEL_UAPI:-7}" \
            --run-id "${RUN_ID:-45575513087}" \
            --artifact-id "${ARTIFACT_ID:-15004182306}" \
            --artifact-digest "${ARTIFACT_DIGEST:-sha256:b084000bb5fc1f932f7addbc00755c8a3176bfda22625cf9c8c091e03a1d38da}" \
            --out "$SIDECAR_DIR/ksud-maplesu.version"
          python3 tools/emit_samsung_sidecar.py --check \
            --payload "$PAYLOAD_DIR/ksud-maplesu" --variant maplesu \
            --out "$SIDECAR_DIR/ksud-maplesu.version"
          cat "$SIDECAR_DIR/ksud-maplesu.version"

      - name: Verify Samsung payload provenance (four variants)
        run: |
          python3 tools/verify_samsung_payloads.py \
            --payloads "$PAYLOAD_DIR" --sidecars "$SIDECAR_DIR"

      - name: Regenerate the payload manifest from the bundled payloads
        run: |
          set -euo pipefail
          python3 tools/gen_payload_versions.py \
            --payloads "$PAYLOAD_DIR" --sidecars "$SIDECAR_DIR" \
            --max-age-hours 48 --lock-out "$LOCK_FILE" --write --allow-problems
          cat "$PAYLOAD_DIR/versions.properties"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK / NDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-${COMPILE_SDK}" \
                                "build-tools;${COMPILE_SDK}.0.0" \
                                "ndk;30.0.16248370"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Point the Gradle wrapper at a reachable mirror
        run: |
          set -euo pipefail
          props=app/gradle/wrapper/gradle-wrapper.properties
          test -f "$props"
          line=$(sed -n 's/^distributionUrl=//p' "$props")
          dist=${line##*/}; dist=${dist//\\/}
          chosen=""
          for base in https://mirrors.cloud.tencent.com/gradle https://mirrors.huaweicloud.com/gradle https://services.gradle.org/distributions; do
            if curl -fsS --max-time 25 -r 0-1023 -o /dev/null "$base/$dist"; then chosen="$base/$dist"; break; fi
            echo "::warning::unreachable Gradle host: $base"
          done
          test -n "$chosen" || { echo "::error::no reachable Gradle distribution host"; exit 1; }
          escaped=$(printf '%s' "$chosen" | sed 's/:/\\:/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$escaped|" "$props"

      - name: Build debug APK (four payloads bundled)
        run: |
          set -e
          cd app
          sed -i "s/compileSdk = 37/compileSdk = ${COMPILE_SDK}/" app/build.gradle.kts
          sed -i "s/ndkVersion = \"30.0.15729638\"/ndkVersion = \"30.0.16248370\"/" app/build.gradle.kts
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.experimental.disableCompileSdkChecks=true; then break; fi
            [ "$attempt" = 4 ] && { echo "::error::gradle failed after 4 attempts"; exit 1; }
            echo "::warning::gradle attempt $attempt failed - retrying"; sleep 20
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prove the APK carries four payloads and the regenerated manifest
        run: |
          set -euo pipefail
          apk="app/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" | grep -E 'assets/payloads/ksud/(ksud|ksud-next|ksud-sukisu|ksud-maplesu|versions.properties)'
          for f in ksud ksud-next ksud-sukisu ksud-maplesu; do
            unzip -p "$apk" "assets/payloads/ksud/$f" > "/tmp/apk-$f"
            test -s "/tmp/apk-$f"
            echo "$f: $(stat -c%s "/tmp/apk-$f") bytes  sha256 $(sha256sum "/tmp/apk-$f" | cut -d' ' -f1)"
          done
          unzip -p "$apk" assets/payloads/ksud/versions.properties > /tmp/apk-versions.properties
          diff -u "$PAYLOAD_DIR/versions.properties" /tmp/apk-versions.properties
          cat /tmp/apk-versions.properties
          cmp "/tmp/apk-ksud-maplesu" "$PAYLOAD_DIR/ksud-maplesu"
          echo "::notice::APK carries four payloads; the maplesu bundle matches the fed payload byte for byte"

      - name: Verify the maplesu variant routing (sources + APK)
        run: |
          python3 tools/verify_variant_routing.py \
            --root . \
            --apk app/app/build/outputs/apk/debug/app-debug.apk \
            --payload "$PAYLOAD_DIR/ksud-maplesu"

      - name: Stage deliverables and a small summary
        run: |
          set -euo pipefail
          mkdir -p dist summary
          cp app/app/build/outputs/apk/debug/app-debug.apk "dist/GhostSam_maplesu-debug-$(date -u +%Y%m%d-%H%M).apk"
          cp "$PAYLOAD_DIR/versions.properties" dist/versions.properties
          cp "$LOCK_FILE" dist/payloads.lock.json
          cp "$SIDECAR_DIR/ksud-maplesu.version" dist/ksud-maplesu.version
          ( cd dist && sha256sum * > checksums.txt && cat checksums.txt )
          # small artifact: everything a reviewer needs, without the 40 MB APK
          cp dist/checksums.txt dist/versions.properties dist/payloads.lock.json dist/ksud-maplesu.version summary/
          sha256sum "$PAYLOAD_DIR/ksud-maplesu" | awk '{print $1"  ksud-maplesu"}' > summary/payload.sha256
          {
            echo "{"
            echo "  \"maplesu_payload_bytes\": $(stat -c%s "$PAYLOAD_DIR/ksud-maplesu"),"
            echo "  \"maplesu_payload_sha256\": \"$(cut -d' ' -f1 summary/payload.sha256)\","
            echo "  \"apk_bytes\": $(stat -c%s dist/*.apk),"
            echo "  \"apk_sha256\": \"$(sha256sum dist/*.apk | cut -d' ' -f1)\","
            echo "  \"run_id\": \"${GITHUB_RUN_ID}\""
            echo "}"
          } > summary/summary.json
          cat summary/summary.json

      - name: Attach the APK to the v0.4.0-maplesu-beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.4.0-maplesu-beta"
          # 主人 created this release (id 457977059, prerelease, tag on this branch).
          # This step only attaches assets to it: it never creates or edits a release,
          # and --clobber only replaces files this workflow uploaded before.
          for attempt in 1 2 3; do
            if gh release upload "$tag" dist/*.apk dist/checksums.txt dist/versions.properties \
                 dist/payloads.lock.json dist/ksud-maplesu.version --clobber; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::release upload failed after 3 attempts"
              exit 1
            fi
            echo "::warning::release upload attempt $attempt failed - retrying in 10s"
            sleep 10
          done
          gh release view "$tag" --json url,assets \
            --jq '.url, (.assets[] | "\(.name) \(.size) \(.browser_download_url)")'

      - uses: actions/upload-artifact@v7
        with:
          name: ghostsam-p5a-summary
          path: summary/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ghostsam-p5a-apk
          path: dist/*
          if-no-files-found: error
